<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bgGrad)" rx="24" />

  <!-- Ambient Glow Effects -->
  <circle cx="200" cy="100" r="250" fill="#4f46e5" opacity="0.25" filter="url(#glow)" />
  <circle cx="1000" cy="400" r="280" fill="#9333ea" opacity="0.2" filter="url(#glow)" />
  <circle cx="600" cy="250" r="180" fill="#06b6d4" opacity="0.1" filter="url(#glow)" />

  <!-- Grid Overlay -->
  <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" opacity="0.3" />
  </pattern>
  <rect width="1200" height="500" fill="url(#gridPattern)" rx="24" />

  <!-- Decorative Floating Mockup Cards (Right Side) -->
  <g transform="translate(680, 60)" filter="url(#shadow)">
    <!-- Main Floating Portfolio Card -->
    <rect x="0" y="0" width="460" height="380" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Browser Topbar -->
    <rect x="0" y="0" width="460" height="44" rx="20" fill="#0f172a" opacity="0.8" />
    <circle cx="24" cy="22" r="5" fill="#ef4444" />
    <circle cx="40" cy="22" r="5" fill="#f59e0b" />
    <circle cx="56" cy="22" r="5" fill="#10b981" />
    <rect x="80" y="12" width="260" height="20" rx="10" fill="#1e293b" />
    <text x="210" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">https://awesome-developer-portfolios.dev</text>

    <!-- Card Content Preview Mockup -->
    <g transform="translate(24, 68)">
      <!-- Hero Banner inside Mockup -->
      <rect x="0" y="0" width="412" height="120" rx="12" fill="url(#primaryGrad)" opacity="0.85" />
      <circle cx="60" cy="60" r="32" fill="#ffffff" opacity="0.2" />
      <rect x="110" y="42" width="180" height="14" rx="7" fill="#ffffff" />
      <rect x="110" y="66" width="120" height="10" rx="5" fill="#ffffff" opacity="0.7" />

      <!-- Feature Grid inside Mockup -->
      <rect x="0" y="136" width="198" height="130" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="30" cy="166" r="14" fill="#6366f1" />
      <rect x="54" y="160" width="100" height="12" rx="6" fill="#f8fafc" />
      <rect x="20" y="192" width="158" height="8" rx="4" fill="#64748b" />
      <rect x="20" y="208" width="130" height="8" rx="4" fill="#64748b" />
      <rect x="20" y="230" width="80" height="20" rx="10" fill="#4f46e5" />

      <rect x="214" y="136" width="198" height="130" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="244" cy="166" r="14" fill="#a855f7" />
      <rect x="268" y="160" width="100" height="12" rx="6" fill="#f8fafc" />
      <rect x="234" y="192" width="158" height="8" rx="4" fill="#64748b" />
      <rect x="234" y="208" width="130" height="8" rx="4" fill="#64748b" />
      <rect x="234" y="230" width="80" height="20" rx="10" fill="#9333ea" />
    </g>
  </g>

  <!-- Left Content Column -->
  <g transform="translate(70, 0)">
    <!-- Top Badge -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="280" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="20" cy="18" r="6" fill="#10b981" />
      <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#a5b4fc" letter-spacing="0.5">1,890+ WORLD-CLASS PORTFOLIOS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      Awesome Developer
    </text>
    <text x="0" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-1.5">
      Portfolios Showcase
    </text>

    <!-- Description Subtitle -->
    <text x="0" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
      A curated collection of developer websites, personal portfolios,
    </text>
    <text x="0" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
      interactive live previews, and design inspiration.
    </text>

    <!-- Category Pills -->
    <g transform="translate(0, 355)">
      <!-- Category 1 -->
      <rect x="0" y="0" width="140" height="38" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="70" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">💻 Full Stack</text>

      <!-- Category 2 -->
      <rect x="152" y="0" width="155" height="38" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="229" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">🤖 AI &amp; Data Science</text>

      <!-- Category 3 -->
      <rect x="319" y="0" width="140" height="38" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="389" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">🎨 UI/UX Design</text>
    </g>

    <!-- Footer Meta -->
    <g transform="translate(0, 425)">
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#64748b">
        Maintained by <tspan fill="#818cf8">@balavenkatesh3322</tspan> • Open Source MIT License
      </text>
    </g>
  </g>
</svg>
